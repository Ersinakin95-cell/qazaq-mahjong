<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Monetag сайтыңызды растауға арналған тег -->
    <meta name="monetag" content="266282acd9c50e949a8c9cd6024e6ed0">
    <title>Махджонг Нақыштары - Қазақы стиль</title>

    <!-- Monetag жарнама скрипті -->
    <script src="https://alwingulla.com/88/tag.min.js" data-zone="123456" async data-cfasync="false"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #020617;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .screen {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 900px;
            background: radial-gradient(circle at 50% 25%, #1e293b, #0f172a, #020617);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px 20px;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        .stats {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .stats span b {
            color: #f8fafc;
        }

        .game-board {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .tile-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 320px;
        }

        .tile {
            aspect-ratio: 3/4;
            background: linear-gradient(135deg, #334155, #1e293b);
            border: 2px solid #475569;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        .tile:active {
            transform: scale(0.95);
        }

        .tile.selected {
            border-color: #38bdf8;
            background: linear-gradient(135deg, #0369a1, #0284c7);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        .tile.matched {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.5);
        }

        footer {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            padding-bottom: 10px;
        }

        .btn {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            max-width: 250px;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.4);
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .msg {
            font-size: 0.95rem;
            color: #38bdf8;
            min-height: 24px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="screen">
        <header>
            <div class="logo">МАХДЖОНГ</div>
            <div class="stats">
                <span>Ұпай: <b id="score">0</b></span>
                <span>Уақыт: <b id="timer">00:00</b></span>
            </div>
        </header>

        <div class="game-board">
            <div class="msg" id="message">Бірдей нақыштарды тауып, жұптаңыз!</div>
            <div class="tile-container" id="tileContainer">
                <!-- Ойын плиткалары скрипт арқылы қосылады -->
            </div>
        </div>

        <footer>
            <button class="btn" onclick="startGame()">Қайта бастау</button>
        </footer>
    </div>

    <script>
        const symbols = ['🀄', '⚜️', '⭐', '🌙', '🔥', '💎', '🎯', '🍀'];
        let tiles = [];
        let selectedTile = null;
        let score = 0;
        let matchesFound = 0;
        let timerInterval = null;
        let secondsElapsed = 0;

        function startGame() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            score = 0;
            matchesFound = 0;
            document.getElementById('score').innerText = score;
            document.getElementById('timer').innerText = '00:00';
            document.getElementById('message').innerText = 'Ойын басталды!';

            startTimer();

            // 8 жұп элемент құру (барлығы 16 плитка)
            tiles = [...symbols, ...symbols]
                .sort(() => Math.random() - 0.5)
                .map((symbol, index) => ({ id: index, symbol, matched: false, selected: false }));

            renderBoard();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                secondsElapsed++;
                let mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                let secs = (secondsElapsed % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function renderBoard() {
            const container = document.getElementById('tileContainer');
            container.innerHTML = '';

            tiles.forEach((tile, index) => {
                const el = document.createElement('div');
                el.classList.add('tile');
                if (tile.matched) el.classList.add('matched');
                if (tile.selected) el.classList.add('selected');
                
                el.innerText = tile.matched ? '' : tile.symbol;
                el.onclick = () => handleTileClick(index);
                container.appendChild(el);
            });
        }

        function handleTileClick(index) {
            let clicked = tiles[index];
            if (clicked.matched || clicked.selected) return;

            if (!selectedTile) {
                selectedTile = index;
                clicked.selected = true;
            } else {
                let first = tiles[selectedTile];
                if (first.symbol === clicked.symbol && selectedTile !== index) {
                    first.matched = true;
                    clicked.matched = true;
                    score += 10;
                    matchesFound++;
                    document.getElementById('score').innerText = score;
                    document.getElementById('message').innerText = 'Жұп табылды! Керемет!';

                    if (matchesFound === symbols.length) {
                        clearInterval(timerInterval);
                        document.getElementById('message').innerText = `Жеңіс! Уақыт: ${document.getElementById('timer').innerText}`;
                    }
                } else {
                    first.selected = false;
                    document.getElementById('message').innerText = 'Қате, басқасын байқап көріңіз.';
                }
                selectedTile = null;
            }
            renderBoard();
        }

        startGame();
    </script>
</body>
</html>
