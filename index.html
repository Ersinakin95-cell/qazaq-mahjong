<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Қазақ стиліндегі жинау ойыны</title>
    <!-- Monetag -->
    <meta name="monetag" content="e5e4318e5ca58d6b7eb38b03155d67fb">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #020617;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .screen {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 900px;
            background: radial-gradient(circle at 50% 25%, #1e293b, #0f172a, #020617);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px 20px;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            overflow: hidden;
            z-index: 1;
        }

        .hidden {
            display: none !important;
            visibility: hidden !important;
            pointer-events: none !important;
            z-index: -9999 !important;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .profile-badge {
            background: #8b4513;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 3px solid #ffcc00;
            box-shadow: 0 0 10px rgba(255,204,0,0.5);
            cursor: pointer;
        }

        .top-right-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .coin-badge, .diamond-badge {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid #ffcc00;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            color: #ffcc00;
            font-size: 13px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        .diamond-badge {
            border-color: #38bdf8;
            color: #38bdf8;
        }

        .settings-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid #ffcc00;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.5);
        }

        .yurt-center {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .yurt-card {
            width: 100%;
            max-width: 380px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 3px solid #ffcc00;
            border-radius: 30px;
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .yurt-graphic {
            width: 180px;
            height: 100px;
            background: radial-gradient(ellipse at bottom, #94a3b8, #475569, #1e293b);
            border-radius: 100px 100px 20px 20px;
            border: 4px solid #ffcc00;
            position: relative;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.6), 0 0 20px rgba(56, 189, 248, 0.4);
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .yurt-door {
            width: 30px;
            height: 45px;
            background: #8b4513;
            border: 2px solid #ffcc00;
            border-radius: 8px 8px 0 0;
            box-shadow: 0 0 10px #38bdf8;
        }

        .yurt-ornament {
            position: absolute;
            top: 18px;
            width: 100%;
            height: 8px;
            background: #ffcc00;
            opacity: 0.8;
        }

        .yurt-title {
            font-size: 17px;
            color: #ffcc00;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255,204,0,0.6);
            margin-bottom: 12px;
        }

        .home-menu-btns {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .menu-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .menu-btn {
            flex: 1;
            background: linear-gradient(to bottom, #3b82f6, #1d4ed8);
            color: white;
            border: 2px solid #ffcc00;
            padding: 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        .menu-btn.bonus-btn {
            background: linear-gradient(to bottom, #eab308, #ca8a04);
        }

        .menu-btn.collection-btn {
            background: linear-gradient(to bottom, #8b5cf6, #6d28d9);
        }

        .bottom-action {
            margin-bottom: 15px;
            z-index: 10;
            width: 100%;
        }

        .level-btn {
            width: 100%;
            height: 65px;
            background: linear-gradient(to bottom, #22c55e, #15803d);
            color: white;
            font-size: 22px;
            font-weight: 900;
            border: 3px solid #ffcc00;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 6px 0 #14532d, 0 10px 20px rgba(0,0,0,0.6);
            transition: 0.05s;
            text-shadow: 1px 2px 2px rgba(0,0,0,0.5);
        }

        .level-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #14532d;
        }

        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.92);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 500;
        }

        .modal-content {
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            width: 90%;
            max-width: 390px;
            padding: 20px;
            border-radius: 25px;
            border: 3px solid #ffcc00;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            z-index: 501;
        }

        .shop-modal-content {
            background: linear-gradient(135deg, #7f1d1d, #450a0a, #7f1d1d);
            width: 92%;
            max-width: 390px;
            padding: 20px;
            border-radius: 25px;
            border: 4px solid #ffcc00;
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.6), inset 0 0 15px rgba(0,0,0,0.6);
            text-align: center;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            z-index: 501;
        }

        .modal-title {
            color: #ffcc00;
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            text-align: center;
        }

        .settings-profile-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,204,0,0.3);
        }

        .profile-edit-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .settings-avatar {
            background: #8b4513;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 2px solid #ffcc00;
        }

        .username-input {
            background: rgba(255,255,255,0.1);
            border: 1px solid #ffcc00;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            padding: 6px 10px;
            font-weight: bold;
            width: 100%;
        }

        .avatar-selector {
            display: flex;
            gap: 8px;
            justify-content: center;
            background: rgba(0,0,0,0.3);
            padding: 6px;
            border-radius: 10px;
        }

        .avatar-option {
            font-size: 22px;
            cursor: pointer;
            padding: 3px;
            border-radius: 50%;
        }

        .avatar-option.selected {
            background: #ffcc00;
        }

        .settings-toggles {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
        }

        .toggle-icon {
            background: #1e293b;
            border: 2px solid #ffcc00;
            font-size: 20px;
            width: 48px; 
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        .toggle-icon.off {
            background: #dc2626;
            opacity: 0.8;
        }

        .lang-select-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 10px;
            border: 1px solid rgba(255,204,0,0.2);
            margin-bottom: 15px;
        }

        .lang-box-title {
            grid-column: 1 / -1;
            font-weight: bold;
            font-size: 12px;
            color: #ffcc00;
            margin-bottom: 2px;
            text-align: center;
        }

        .lang-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,204,0,0.3);
            color: white;
            padding: 8px 6px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lang-btn.active {
            background: linear-gradient(to right, #15803d, #22c55e);
            border-color: #ffcc00;
        }

        .settings-menu {
            list-style: none;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 5px 15px;
            border: 1px solid rgba(255,204,0,0.2);
            margin-bottom: 15px;
        }

        .settings-menu li {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .settings-menu li:last-child {
            border-bottom: none;
        }

        .admin-code-btn {
            background: linear-gradient(to bottom, #dc2626, #991b1b);
            color: #fff;
            border: 2px solid #ffcc00;
            padding: 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            margin-bottom: 10px;
        }

        .shop-section-label {
            color: #fca5a5;
            font-size: 13px;
            font-weight: bold;
            margin: 10px 0 5px 0;
            text-align: left;
        }

        .item-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 204, 0, 0.4);
            border-radius: 12px;
            padding: 10px 14px;
            margin: 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-title {
            font-weight: bold;
            font-size: 14px;
            color: #fff;
        }

        .item-desc {
            font-size: 11px;
            color: #cbd5e1;
        }

        .claim-btn {
            background: linear-gradient(to bottom, #22c55e, #16a34a);
            color: #fff;
            border: 1px solid #ffcc00;
            padding: 6px 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        .claim-btn.disabled {
            background: #475569;
            border-color: #64748b;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .close-btn {
            background: #ef4444;
            border: 2px solid #ffcc00;
            color: white;
            font-size: 16px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .toast-banner {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(to bottom, #22c55e, #15803d);
            border: 3px solid #ffcc00;
            border-radius: 20px;
            padding: 18px 22px;
            color: #fff;
            font-weight: 900;
            font-size: 16px;
            text-align: center;
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.8);
            z-index: 999;
            width: 85%;
            max-width: 350px;
            pointer-events: none;
        }

        #game-screen {
            background: #061c12;
        }

        .game-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 5px;
        }

        .back-btn {
            background: #14532d;
            color: #ffcc00;
            border: 2px solid #ffcc00;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .game-header h3 {
            color: #ffcc00;
            font-size: 18px;
            font-weight: 800;
        }

        .collection-box {
            height: 75px;
            background: #022c22;
            border: 3px solid #ffcc00;
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 12px 0;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.6);
        }

        .slot {
            width: 52px;
            height: 52px;
            background: #14532d;
            border-radius: 12px;
            border: 2px solid rgba(255,204,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
        }

        .board-container {
            flex-grow: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 10px;
        }

        .layered-board {
            position: relative;
            width: 100%;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tile {
            position: absolute;
            width: 62px;
            height: 70px;
            background: #fff8e7;
            border-radius: 12px;
            border: 2px solid #8b4513;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 5px 0 #b38642, 0 8px 12px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
        }

        .tile.blocked {
            filter: brightness(0.5) grayscale(0.4);
            cursor: not-allowed;
            box-shadow: 0 2px 0 #555;
        }

        .booster-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .booster-btn {
            background: #1e293b;
            border: 2px solid #ffcc00;
            color: #ffcc00;
            padding: 8px 12px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }

        .rtl {
            direction: rtl;
        }
    </style>
</head>
<body>

    <!-- Бас экран -->
    <div id="home-screen" class="screen">
        <div class="top-bar">
            <div class="profile-badge" id="main-avatar" onclick="openSettings()">🧔🏽‍♂️</div>
            <div class="top-right-group">
                <div class="coin-badge" id="coin-display" onclick="openShop()">🪙 100</div>
                <div class="diamond-badge" id="diamond-display" onclick="openShop()">💎 5</div>
                <button class="settings-btn" onclick="openSettings()">⚙️</button>
            </div>
        </div>

        <div class="yurt-center">
            <div class="yurt-card">
                <div class="yurt-graphic">
                    <div class="yurt-ornament"></div>
                    <div class="yurt-door"></div>
                </div>
                <div class="yurt-title" id="t-game-title">ҚАЗАҚ СТИЛІНДЕГІ ЖИНАУ ОЙЫНЫ</div>
                
                <div class="home-menu-btns">
                    <div class="menu-row">
                        <button class="menu-btn" id="t-btn-shop" onclick="openShop()">🛒 ДҮКЕН</button>
                        <button class="menu-btn bonus-btn" id="t-btn-bonuses" onclick="openBonusModal()">🎁 БОНУСТАР</button>
                    </div>
                    <button class="menu-btn collection-btn" id="t-btn-collection" onclick="openCollectionModal()">🏆 ЖЕТІ ҚАЗЫНА</button>
                </div>
            </div>
        </div>

        <div class="bottom-action">
            <button class="level-btn" id="btn-level" onclick="startGame()">1-ші Деңгей</button>
        </div>
    </div>

    <!-- Дүкен Модалі -->
    <div id="shop-modal" class="modal hidden">
        <div class="shop-modal-content">
            <div class="modal-title" id="t-shop-title">🛒 ДҮКЕН (KASPI)</div>
            
            <div class="shop-section-label" id="t-coins-label">🪙 МОНЕТАЛАР:</div>
            <div class="item-card">
                <div>
                    <div class="item-title">🪙 500 <span class="t-coin-word">Монета</span></div>
                </div>
                <button class="claim-btn" onclick="buyItem('500 Монета', '100 ТГ')">100 ТГ</button>
            </div>
            <div class="item-card">
                <div>
                    <div class="item-title">🪙 3000 <span class="t-coin-word">Монета</span></div>
                </div>
                <button class="claim-btn" onclick="buyItem('3000 Монета', '400 ТГ')">400 ТГ</button>
            </div>

            <div class="shop-section-label" id="t-diamonds-label">💎 АЛМАЗДАР:</div>
            <div class="item-card">
                <div>
                    <div class="item-title">💎 10 <span class="t-diamond-word">Алмаз</span></div>
                </div>
                <button class="claim-btn" onclick="buyItem('10 Алмаз', '200 ТГ')">200 ТГ</button>
            </div>
            <div class="item-card">
                <div>
                    <div class="item-title">💎 50 <span class="t-diamond-word">Алмаз</span></div>
                </div>
                <button class="claim-btn" onclick="buyItem('50 Алмаз', '800 ТГ')">800 ТГ</button>
            </div>

            <button class="close-btn" style="margin: 15px auto 0 auto;" onclick="closeModal('shop-modal')">✕</button>
        </div>
    </div>

    <!-- Бонустар Модалі -->
    <div id="bonus-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-title" id="t-bonus-title">🎁 ДЕҢГЕЙ БОНУСТАРЫ</div>
            
            <div id="bonus-list"></div>

            <button class="close-btn" style="margin: 15px auto 0 auto;" onclick="closeModal('bonus-modal')">✕</button>
        </div>
    </div>

    <!-- Жеті Қазына Коллекция Модалі -->
    <div id="collection-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-title" id="t-collection-title">🏆 ЖЕТІ ҚАЗЫНА</div>
            
            <div id="collection-list"></div>

            <button class="close-btn" style="margin: 15px auto 0 auto;" onclick="closeModal('collection-modal')">✕</button>
        </div>
    </div>

    <!-- Баптаулар Модалі -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="color: #ffcc00; font-size: 20px;" id="t-settings-title">⚙️ Баптаулар</h3>
                <button class="close-btn" onclick="closeModal('settings-modal')">✕</button>
            </div>

            <div class="settings-profile-card">
                <div class="profile-edit-row">
                    <div class="settings-avatar" id="edit-avatar">🧔🏽‍♂️</div>
                    <input type="text" class="username-input" id="username-input" value="Ойыншы" oninput="checkAdminPass(this.value)" onkeyup="checkAdminPass(this.value)">
                </div>
                <div class="avatar-selector">
                    <span class="avatar-option selected" onclick="selectAvatar('🧔🏽‍♂️', this)">🧔🏽‍♂️</span>
                    <span class="avatar-option" onclick="selectAvatar('👨‍💼', this)">👨‍💼</span>
                    <span class="avatar-option" onclick="selectAvatar('🤴', this)">🤴</span>
                    <span class="avatar-option" onclick="selectAvatar('🧕', this)">🧕</span>
                    <span class="avatar-option" onclick="selectAvatar('🇰🇿', this)">🇰🇿</span>
                </div>
            </div>

            <div class="settings-toggles">
                <button id="btn-music" class="toggle-icon" onclick="toggleToggle('btn-music')">🎵</button>
                <button id="btn-sound" class="toggle-icon" onclick="toggleToggle('btn-sound')">🔊</button>
                <button id="btn-vibrate" class="toggle-icon" onclick="toggleToggle('btn-vibrate')">📳</button>
            </div>

            <!-- Тіл Таңдау Боксы -->
            <div class="lang-select-box">
                <div class="lang-box-title" id="t-select-lang">🌐 ТІЛДІ ТАҢДАУ / LANGUAGE:</div>
                <button class="lang-btn active" id="lang-kk" onclick="changeLanguage('kk')">🇰🇿 Қазақша <span>✓</span></button>
                <button class="lang-btn" id="lang-ru" onclick="changeLanguage('ru')">🇷🇺 Русский</button>
                <button class="lang-btn" id="lang-en" onclick="changeLanguage('en')">🇬🇧 English</button>
                <button class="lang-btn" id="lang-tr" onclick="changeLanguage('tr')">🇹🇷 Türkçe</button>
                <button class="lang-btn" id="lang-zh" onclick="changeLanguage('zh')">🇨🇳 中文</button>
